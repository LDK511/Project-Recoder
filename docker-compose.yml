version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopping-mall-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_mall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: shopping-mall-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopping_mall
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-min-32-chars}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      NODE_ENV: test
      PAYMENT_MODE: mock
      STRIPE_MOCK_HOST: mock-payment
      STRIPE_MOCK_PORT: 3001
      SEED_DEMO: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: npm run dev

  mock-payment:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-payment
    container_name: shopping-mall-mock-payment
    environment:
      PORT: 3001
      BACKEND_URL: http://backend:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./mock-payment:/app/mock-payment
      - /app/mock-payment/node_modules
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: shopping-mall-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm run dev

volumes:
  postgres_data:
